<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>

    <link rel="stylesheet" href="login.css">

    <script src="login-funciones.js" defer></script>

</head>

<body>
    <main>

        <section>
            <h1> Inicio de secion</h1>
            <form id="form-login">
                <label for="correo">Correo</label>
                <input type="email" id="correo" placeholder="correo Electronico" required>

                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" placeholder="contraseña" required>

                <button class="Boton-inicio" type="submit">Iniciar secion</button>
                <p class="mensaje-login" id="mensaje-login"></p>

                <p class="enlace-registro">
                    ¿No tiene cuenta?
                    <a href="registro.html" class="enlace-registro">Registrate aqui</a>
                </p>

            </form>
        </section>

    </main>
    <footer>
        <section class="InformacionContacto" id="InformacionContacto">
            <p>Informacion de contato </p>
            <p>Contactos</p>
            <ul>
                <li>Telefono: 123-456-7890</li>
                <li>Gmail: info@clinica.com</li>
            </ul>

            <p>&copy; 2026 Clínica Veterinaria.</p>
        </section>

    </footer>
</body>

</html>
