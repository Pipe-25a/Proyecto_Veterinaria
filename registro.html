<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link rel="stylesheet" href="registro.css">

    <script src="registro-funciones.js" defer></script>

</head>

<body>
    <main>
        <section>
            <section class="logo">
                <img src="Imagen_icon.jpg" alt="Logo de la Clínica Veterinaria">

            </section>

            <section class="Titulo">
                <h1>Formulario de Citas</h1>
            </section>

            <section class="navegacion">
                <nav>
                    <h2>Menú de Navegación</h2>
                    <ul>
                        <li><a href="Pagina_principal.html">Inicio</a></li>
                        <li><a href="#InformacionContacto">Informacion de Contacto</a></li>
                    </ul>
                </nav>
            </section>

            <section>
                <h3>Registrate</h3>
                <form class="form-registro" id="form-registro">

                    <label for="reg-nombre">Nombre</label>
                    <input type="text" id="reg-nombre" placeholder="Nombre Completo" required>

                    <label for="reg-correo">Correo</label>
                    <input type="email" id="reg-correo" placeholder="Correo Electronico" required>

                    <label for="reg-contraseña">Contraseña</label>
                    <input type="password" id="reg-contraseña" placeholder="Mínimo 6 caracteres" required>

                    <label for="reg-contraseña-confirmar">Confirmar contraseña</label>
                    <input type="password" id="reg-contraseña-confirmar" placeholder="Repita la constraseña" required>

                    <button type="submit" class="boton-enviar">Crear cuenta</button>
                    <p id="mensaje-registro"></p>

                    <p class="reg-login">¿Ya tienes cuenta?
                        <a href="login.html" class="enlace-login">Iniciar secion</a>
                    </p>
                </form>
            </section>
        </section>
    </main>
    <footer>
        <section class="InformacionContacto" id="InformacionContacto">
            <p>Informacion de contato </p>
            <p>Contactos</p>
            <ul>
                <li>Telefono: 123-456-7890</li>
                <li>Gmail: info@clinica.com</li>
            </ul>

            <p>&copy; 2026 Clínica Veterinaria.</p>
        </section>

    </footer>

</body>

</html>
